name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'style.css'
      - 'common.js'
      - 'backend.js'
      - 'game.js'
      - 'ui.js'
      - 'resources/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build local web bundle
        run: |
          rm -rf www
          mkdir -p www
          cp index.html style.css common.js backend.js game.js ui.js www/
          sed -i 's#<title>မြန်မာကျား Online</title>#<title>မြန်မာ ကျားကွက်</title>#' www/index.html || true
          sed -i 's#🐅 မြန်မာကျားကွက်#🐅 မြန်မာ ကျားကွက်#' www/index.html || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/common.js')
          s=p.read_text(encoding='utf-8')
          old='const GATEWAY_ORIGIN=(location.protocol==="http:"||location.protocol==="https:")?location.origin:"https://myanmar-kyar-online-waiyanmyothein603-9487.vercel.app";'
          new='const GATEWAY_ORIGIN=(location.hostname==="localhost"||location.hostname==="127.0.0.1"||location.protocol==="file:")?"https://myanmar-kyar-online.vercel.app":location.origin;'
          if old in s:
              s=s.replace(old,new,1)
          else:
              lines=s.splitlines()
              for i,line in enumerate(lines):
                  if line.startswith('const GATEWAY_ORIGIN='):
                      lines[i]=new
                      break
              s='\n'.join(lines)+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Android name and icon
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          if [ -f "$STRINGS" ]; then
            sed -i 's#<string name="app_name">.*</string>#<string name="app_name">မြန်မာ ကျားကွက်</string>#' "$STRINGS" || true
          fi
          if [ -f resources/app-icon.b64 ]; then
            if base64 --decode resources/app-icon.b64 > /tmp/mko-icon.png 2>/dev/null; then
              for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
                mkdir -p "android/app/src/main/res/mipmap-$d"
                cp /tmp/mko-icon.png "android/app/src/main/res/mipmap-$d/ic_launcher.png"
                cp /tmp/mko-icon.png "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
                cp /tmp/mko-icon.png "android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png"
              done
            else
              echo 'Custom icon data is incomplete; keeping Capacitor launcher icon for this build.'
            fi
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Kyar-Online-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
